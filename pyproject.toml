[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Shiyanthan"
version = "3.0.0"
authors = [
    {name = "ssecgroup", email = "ssecgroup08@gmail.com"},
]
description = "Ultimate GAU - Get All URLs from multiple free web archives"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
keywords = ["security", "bugbounty", "reconnaissance", "osint", "web-archive"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/ssecgroup/ultimate-gau"
Repository = "https://github.com/ssecgroup/ultimate-gau"
Documentation = "https://github.com/ssecgroup/ultimate-gau#readme"
Donate = "https://github.com/ssecgroup/ultimate-gau#support-the-project"

[project.scripts]
ugau = "ultimate_gau.cli:main"
ultimate-gau = "ultimate_gau.cli:main"

[project.optional-dependencies]
progress = ["tqdm>=4.62.0"]
validation = ["validators>=0.18.0"]
all = ["tqdm>=4.62.0", "validators>=0.18.0"]

[tool.setuptools]
packages = ["ultimate_gau"]
